# Mobile app CI + over-the-air updates (EAS Update).
#
# On every pull request that touches frontend/: run the checks.
# On every push to main that touches frontend/: run the checks and, if they pass,
# publish an OTA update to the "production" channel. Installed builds on that channel
# download it the next time the app is opened.
#
# Requires the repository secret EXPO_TOKEN (an Expo access token with access to the
# IRHIS Expo project). See docs/deployment.md#over-the-air-updates.

name: App checks and OTA update

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/app-update.yml"
  pull_request:
    paths:
      - "frontend/**"
  workflow_dispatch:

concurrency:
  group: app-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: App checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (no new errors)
        run: node scripts/check-types.js

      - name: Runtime version guard
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-runtime-version.js

  publish:
    name: Publish OTA update
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "The EXPO_TOKEN repository secret is missing. See docs/deployment.md#over-the-air-updates"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update to the production channel
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TITLE="$(printf '%s' "${COMMIT_MESSAGE:-manual publish}" | head -n 1)"
          eas update \
            --channel production \
            --message "${TITLE} (${GITHUB_SHA::7})" \
            --non-interactive
